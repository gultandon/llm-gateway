# One-node kind cluster for the gateway. The Service is a NodePort on 30080 (overlays/kind),
# published on the host's loopback only, so the gateway is at http://localhost:8080.
# kind ships a default StorageClass (local-path), so the k1 PVC binds as is, and kindnet
# enforces NetworkPolicy.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-gateway
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
