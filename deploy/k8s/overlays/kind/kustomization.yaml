# K1 on a local kind cluster: the k1 overlay behind ingress-nginx. The image is the local
# llm-gateway:dev build, loaded into the node with `kind load docker-image` (no registry), and
# the PVC binds to kind's default local-path StorageClass.
# Prerequisites: terraform in infra/kind, then deploy/k8s/cluster/kind.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k1
patches:
  - target: {kind: Ingress, name: gateway}
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: nginx
